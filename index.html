<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GuardianLink Parental Control & Monitoring Suite</title>
    <meta name="description" content="Comprehensive parental control admin panel and stealth Android child activity tracker with real-time GPS, live camera/mic streaming, screen mirroring, call/SMS logs, app lockdown, and remote management." />
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="theme-color" content="#1e293b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GuardianLink" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <meta property="og:title" content="GuardianLink Parental Control & Monitoring Suite" />
    <meta property="og:description" content="Comprehensive parental control admin panel and stealth Android child activity tracker with real-time GPS, live camera/mic streaming, screen mirroring, call/SMS logs, app lockdown, and remote management." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0f172a] text-slate-100 antialiased selection:bg-blue-600 selection:text-white font-sans m-0 p-0 overflow-x-hidden" style="background-color: #0f172a; color: #f1f5f9; min-height: 100vh;">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #090e1a; color: #94a3b8; font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 20px;">
        <div style="width: 48px; height: 48px; border: 3px solid #1e293b; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px;"></div>
        <div style="font-size: 16px; font-weight: 700; color: #ffffff; margin-bottom: 6px;">GuardianLink Loading...</div>
        <div style="font-size: 12px; color: #64748b;">Initializing Parental Suite & Child Mode</div>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        console.error('Root window error:', e);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
